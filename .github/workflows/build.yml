name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Prepare www
        run: |
          mkdir -p www
          cp index.html www/index.html
      - name: Install
        run: npm install
      - name: Add android
        run: npx cap add android
      - name: FORCE custom icon
        run: |
          pip install Pillow
          python3 << 'PY'
          from PIL import Image
          import pathlib
          src = pathlib.Path("icon.png")
          im = Image.open(src).convert("RGBA")
          sizes = {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
          base = pathlib.Path("android/app/src/main/res")
          for folder,size in sizes.items():
              p = base / folder
              if p.exists():
                  resized = im.resize((size,size), Image.LANCZOS)
                  for name in ["ic_launcher.png","ic_launcher_round.png","ic_launcher_foreground.png"]:
                      fp = p / name
                      resized.save(fp)
                      print(f"replaced {fp}")
          PY
      - name: Camera permission
        run: sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA" \/>\n <application/' android/app/src/main/AndroidManifest.xml
      - name: Copy web
        run: npx cap copy android
      - name: Build APK
        run: cd android && chmod +x gradlew &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CalcAI-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
