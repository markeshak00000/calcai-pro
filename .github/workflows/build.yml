name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm install
      - run: npx cap add android
      - run: |
          mkdir -p resources
          cp icon.png resources/icon.png
          npx capacitor-assets generate --android --iconBackgroundColor '#000000' --splashBackgroundColor '#000000' || true
      - run: sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA" \/>\n <application/' android/app/src/main/AndroidManifest.xml
      - run: npx cap copy android
      - run: cd android && chmod +x gradlew &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CalcAI-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
